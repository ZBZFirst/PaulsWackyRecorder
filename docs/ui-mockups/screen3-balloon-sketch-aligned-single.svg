  <text x="1100" y="366" font-family="Arial, sans-serif" font-size="18" fill="#5F6787">You always know where expanded controls came from.</text>
  <text x="1100" y="400" font-family="Arial, sans-serif" font-size="18" fill="#5F6787">It can hold only the most important knobs first.</text>
