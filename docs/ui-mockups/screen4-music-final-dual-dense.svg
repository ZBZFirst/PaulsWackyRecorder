<svg width="1600" height="1100" viewBox="0 0 1600 1100" fill="none" xmlns="http://www.w3.org/2000/svg">
  <style>
    .bg { fill: #0D1326; }
    .panel { fill: #182445; stroke: #3A4D7A; stroke-width: 2; }
    .panel-soft { fill: #22315C; stroke: #4B5F8F; stroke-width: 2; }
    .panel-green { fill: #173E2C; stroke: #44D48A; stroke-width: 3; }
    .panel-pink { fill: #412043; stroke: #F268B7; stroke-width: 3; }
    .strip { fill: #22315C; stroke: #4B5F8F; stroke-width: 2; }
    .strip-green { fill: #1A4D37; stroke: #44D48A; stroke-width: 3; }
    .strip-pink { fill: #5B285A; stroke: #F268B7; stroke-width: 3; }
    .dock-head { fill: #2A3A68; }
    .chip { fill: #314675; }
    .pad-green { fill: #79D78E; }
    .pad-blue { fill: #4B6EAF; }
    .pad-pink { fill: #E36AC2; }
    .label { fill: #F6F8FD; font-family: Arial, sans-serif; font-size: 30px; font-weight: 700; }
    .small { fill: #D8E1F3; font-family: Arial, sans-serif; font-size: 20px; }
    .tiny { fill: #AFC0E6; font-family: Arial, sans-serif; font-size: 17px; }
    .title { fill: #F8FAFF; font-family: Arial, sans-serif; font-size: 42px; font-weight: 700; }
  </style>

  <rect class="bg" width="1600" height="1100"/>
  <text x="800" y="62" text-anchor="middle" class="title">Screen 4 Final Direction - Dense Five-Bar Dual Edit State</text>

  <rect x="32" y="88" width="1536" height="120" rx="28" class="panel"/>
  <text x="70" y="138" class="label">Transport</text>
  <text x="70" y="174" class="tiny">Compact at the top. Everything important stays visible.</text>
  <text x="1010" y="138" class="small">BPM 128</text>
  <text x="1160" y="138" class="small">Playing</text>
  <text x="1290" y="138" class="small">Cycle 4/4</text>
  <text x="1420" y="138" class="small">Success</text>

  <rect x="32" y="230" width="1536" height="150" rx="28" class="panel"/>
  <text x="70" y="286" class="label">Five-Bar Strip Roster</text>
  <text x="70" y="320" class="tiny">At 5 bars the strips go dense. No inline step pads here. Only name, count, state, and open toggle.</text>

  <rect x="70" y="305" width="260" height="50" rx="18" class="strip-green"/>
  <text x="95" y="338" class="small">BAR 1 DRUMS   16/16</text>
